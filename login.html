<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Josue Challco</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <!-- Política de seguridad: solo código y estilos de este sitio; conexiones solo a este sitio y a Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; form-action 'self'; base-uri 'none'; object-src 'none'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">jc<span>.</span></a>
  <nav id="menu">
    <a href="index.html">← Volver al portafolio</a>
  </nav>
  <div class="nav-actions">
    <button id="theme" class="icon-btn" aria-label="Cambiar tema">◐</button>
    <button id="burger" class="icon-btn burger" aria-label="Abrir menú">☰</button>
  </div>
</header>

<main class="auth">
  <div class="auth-card reveal" id="card">
    <p class="eyebrow" id="eyebrow">Acceso</p>
    <h1 id="title">Iniciar sesión</h1>
    <p class="lead" id="subtitle">Ingresa con tu correo y tu código de acceso.</p>

    <form id="form" method="post" action="#" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com"
               autocomplete="username" maxlength="120" required>
      </div>

      <div class="field">
        <label for="password">Código de acceso o contraseña</label>
        <div class="pw">
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" autocapitalize="off" spellcheck="false" maxlength="128" required>
          <button type="button" id="toggle" class="show" aria-pressed="false" aria-label="Mostrar">Mostrar</button>
        </div>
        <p class="hint">El código te lo entrega el administrador. Escríbelo tal cual, en mayúsculas.</p>
      </div>

      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button type="submit" id="submit" class="btn primary">Entrar</button>
    </form>

    <!-- Sesión iniciada (usuarios con código) -->
    <div id="session" hidden>
      <p class="session-info" id="sessionInfo"></p>
      <button type="button" id="logout" class="btn">Cerrar sesión</button>
    </div>

    <p class="note" id="note">Solo los correos autorizados por el administrador pueden entrar.</p>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Josue Challco Soto.</p>
</footer>

<script src="script.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="login.js"></script>
</body>
</html>
